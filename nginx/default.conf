# ==============================================================================
# /etc/nginx/conf.d/default.conf
#
# CRITICAL FIX — CSP multi-line directive broken in nginx:
#   nginx does NOT support backslash line continuation for add_header values.
#   A multi-line add_header directive only sends the FIRST line as the header
#   value — everything after the first newline is silently dropped.
#   Result: browser receives only "default-src 'self'" and blocks everything.
#   Fix: the entire CSP value must be on ONE line inside the quotes.
#
# CSP additions in this version:
#   style-src:  added https://fonts.googleapis.com  (Google Fonts CSS import)
#               added 'unsafe-inline'               (inline style attributes in JS modals)
#   font-src:   added https://fonts.gstatic.com     (Google Fonts binary files)
#   img-src:    added https://picsum.photos         (carousel placeholder images)
#               added https:                        (any HTTPS image source)
# ==============================================================================

limit_req_zone $binary_remote_addr zone=register_limit:10m rate=5r/m;
limit_req_zone $binary_remote_addr zone=api_limit:10m      rate=30r/m;
limit_req_status 429;


server {
    listen 80;
    server_name localhost;

    server_tokens off;

    client_max_body_size  1m;
    client_header_timeout 10s;
    client_body_timeout   10s;
    send_timeout          10s;

    autoindex off;

    # --------------------------------------------------------------------------
    # Security Headers
    # --------------------------------------------------------------------------
    add_header X-Frame-Options        "DENY"                            always;
    add_header X-Content-Type-Options "nosniff"                         always;
    add_header X-XSS-Protection       "0"                               always;
    add_header Referrer-Policy        "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy     "geolocation=(), camera=(), microphone=(), payment=(), usb=()" always;

    # --------------------------------------------------------------------------
    # Content Security Policy — single line (nginx requirement)
    #
    # default-src 'self'
    #   Baseline: only same-origin resources allowed unless overridden below.
    #
    # script-src 'self'
    #   Only scripts from the same origin. No inline scripts, no eval().
    #
    # style-src 'self' 'unsafe-inline' https://fonts.googleapis.com
    #   'unsafe-inline': required for inline style attributes set by JS modals
    #     (login-modal.js and register-modal.js apply inline styles directly).
    #     Without this, the browser blocks dynamically applied styles.
    #   fonts.googleapis.com: Google Fonts CSS @import.
    #
    # font-src 'self' https://fonts.gstatic.com
    #   fonts.gstatic.com: where the actual .woff2 font files are hosted.
    #   Without this, the font CSS loads but the font files are blocked.
    #
    # img-src 'self' data: https://picsum.photos https:
    #   picsum.photos: placeholder images in the hologram carousel JSON.
    #   https:: allows any HTTPS image (covers CDN-hosted project images).
    #   data:: covers base64-encoded images used in some UI components.
    #
    # connect-src 'self'
    #   fetch() and XHR only to the same origin (/api/*).
    #
    # frame-ancestors 'none'
    #   Equivalent to X-Frame-Options DENY — belt-and-suspenders.
    #
    # base-uri 'self'
    #   Prevents <base> tag injection that could rewrite all relative URLs.
    #
    # form-action 'self'
    #   HTML forms may only submit to the same origin.
    # --------------------------------------------------------------------------
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: https://picsum.photos https:; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self';" always;

    # HSTS omitted — HTTP only (port 80). Add on HTTPS:
    # add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;


    # ==========================================================================
    # FRONTEND — SPA
    # ==========================================================================
    root  /var/www/portal;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }

    # Static asset caching + hotlink protection
    location ~* \.(jpg|jpeg|png|gif|svg|webp|ico|bmp|tiff|woff|woff2|ttf|otf)$ {
        valid_referers none blocked server_names;
        if ($invalid_referer) { return 403; }
        expires 30d;
        add_header Cache-Control "public, immutable";
        access_log off;
    }


    # ==========================================================================
    # BACKEND API
    # ==========================================================================
    location /api {
        root  /var/www;
        index index.php;

        try_files $uri $uri/ /api/index.php?$query_string;

        # Registration — strict 5 req/min per IP
        location = /api/register.php {
            limit_req zone=register_limit burst=5 nodelay;
            root /var/www;
            include fastcgi_params;
            fastcgi_pass  php:9000;
            fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
            fastcgi_index index.php;
        }

        # CSRF token — general API limit
        location = /api/csrf-token.php {
            limit_req zone=api_limit burst=10 nodelay;
            root /var/www;
            include fastcgi_params;
            fastcgi_pass  php:9000;
            fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
            fastcgi_index index.php;
        }

        # All other PHP files
        location ~ \.php$ {
            limit_req zone=api_limit burst=20 nodelay;
            root /var/www;
            try_files $fastcgi_script_name =404;
            include fastcgi_params;
            fastcgi_pass         php:9000;
            fastcgi_param        SCRIPT_FILENAME $document_root$fastcgi_script_name;
            fastcgi_index        index.php;
            fastcgi_buffering    off;
            fastcgi_read_timeout 30s;
        }
    }


    # ==========================================================================
    # SECURITY — File & Directory Protection
    # ==========================================================================

    # Dotfiles (.env, .git, .htaccess, .DS_Store)
    location ~ /\. {
        deny all;
        return 404;
    }

    # Sensitive file extensions (note: .json excluded — PHP API serves JSON responses)
    location ~* \.(env|lock|md|sql|log|bak|backup|sh|bat|ini|cfg|conf|key|pem|crt)$ {
        deny all;
        return 404;
    }

    # Config directory — DB credentials, bootstrap
    location ^~ /api/config/ {
        deny all;
        return 404;
    }

    # Vendor directory — Composer dependencies
    location ^~ /api/vendor/ {
        deny all;
        return 404;
    }

    # Directory traversal — catch literal ".." in URI
    if ($request_uri ~* "\.\.") {
        return 400;
    }

    # RCE prevention — no PHP execution in upload directories
    location ~* ^/uploads/.*\.(php[0-9]?|phtml|phar)$ {
        deny all;
        return 404;
    }

    location ^~ /uploads/ {
        add_header X-Content-Type-Options "nosniff" always;
        location ~ \.php$ {
            deny all;
            return 404;
        }
    }


    # ==========================================================================
    # Custom error pages (create files in /var/www/portal/errors/)
    # ==========================================================================
    error_page 400 /errors/400.html;
    error_page 403 /errors/403.html;
    error_page 404 /errors/404.html;
    error_page 429 /errors/429.html;
    error_page 500 502 503 504 /errors/50x.html;

    location ^~ /errors/ {
        internal;
    }
}